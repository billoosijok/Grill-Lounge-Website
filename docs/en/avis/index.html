<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Title and Description are set dynamically per page/language -->
    <title>Your Review - Grill Lounge Narbonne</title>
    <meta name="description" content="Share your experience at Grill Lounge in Narbonne. Your feedback means the world to us." />
    
    <meta name="robots" content="noindex, nofollow" />
    

    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Google Consent Mode v2 Default State -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      var consentChoice = localStorage.getItem('cookie-consent-choice');
      var consentState = consentChoice === 'accepted' ? 'granted' : 'denied';

      gtag('consent', 'default', {
        'ad_storage': consentState,
        'ad_user_data': consentState,
        'ad_personalization': consentState,
        'analytics_storage': consentState
      });
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQYS58J1H6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DQYS58J1H6');
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
  </head>
  <body>
    <div id="root">
        

<style>
    .avis-page {
        background-color: var(--primary-bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        box-sizing: border-box;
        color: var(--text-main);
        font-family: 'Goudy Bookletter 1911', serif;
    }

    .avis-card {
        width: 100%;
        max-width: 440px;
        background-color: var(--white);
        border: 1px solid rgba(0, 0, 0, 0.03);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        padding: 40px 28px;
        text-align: center;
        box-sizing: border-box;
    }

    .avis-logo {
        max-width: 200px;
        margin: 0 auto 25px auto;
        display: block;
    }

    .avis-step {
        display: none;
    }

    .avis-step.active {
        display: block;
        animation: avisFadeIn 0.3s ease both;
    }

    @keyframes avisFadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .avis-title {
        font-family: "Outfit", sans-serif;
        font-size: 1.7em;
        color: var(--accent-green);
        margin: 0 0 10px 0;
    }

    .avis-subtitle {
        color: var(--text-muted);
        font-size: 1.05em;
        line-height: 1.5;
        margin: 0 0 25px 0;
    }

    .avis-stars {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
    }

    .avis-star-btn {
        background: none;
        border: none;
        padding: 4px 0;
        cursor: pointer;
        transition: transform 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
    }

    .avis-star-btn:hover {
        transform: scale(1.12);
    }

    .avis-star-btn svg {
        width: 100%;
        max-width: 44px;
        height: auto;
        aspect-ratio: 1 / 1;
        color: rgba(0, 0, 0, 0.12);
        transition: color 0.15s;
        display: block;
        margin: 0 auto;
    }

    .avis-star-btn.filled svg {
        color: #ffb400;
    }

    .avis-star-btn.star-5-accent svg {
        color: #c59d5f !important;
        filter: drop-shadow(0 0 10px rgba(197, 157, 95, 0.7));
        transform: scale(1.05);
    }

    .avis-labels-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
        max-width: 320px;
        margin: 10px auto 0 auto;
        font-family: "Outfit", sans-serif;
        font-size: 0.7rem;
    }

    .avis-label-bracket {
        grid-column: span 3;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        align-items: center;
        color: rgba(244, 63, 94, 0.9);
        font-weight: 500;
    }

    .avis-bracket-col-1 {
        position: relative;
        height: 14px;
        display: flex;
        align-items: center;
    }

    .avis-bracket-col-1 .avis-tick {
        position: absolute;
        left: 50%;
        top: 0;
        width: 1px;
        height: 10px;
        background-color: rgba(244, 63, 94, 0.6);
        transform: translateX(-50%);
    }

    .avis-bracket-col-1 .avis-line-left {
        position: absolute;
        left: 50%;
        right: 0;
        top: 5px;
        height: 1px;
        background-color: rgba(244, 63, 94, 0.4);
    }

    .avis-bracket-text {
        white-space: nowrap;
        line-height: 1;
        text-align: center;
        font-size: 0.7rem;
        padding: 0 2px;
    }

    .avis-bracket-col-3 {
        position: relative;
        height: 14px;
        display: flex;
        align-items: center;
    }

    .avis-bracket-col-3 .avis-line-right {
        position: absolute;
        left: 0;
        right: 50%;
        top: 5px;
        height: 1px;
        background-color: rgba(244, 63, 94, 0.4);
    }

    .avis-bracket-col-3 .avis-tick {
        position: absolute;
        left: 50%;
        top: 0;
        width: 1px;
        height: 10px;
        background-color: rgba(244, 63, 94, 0.6);
        transform: translateX(-50%);
    }

    .avis-label-star4 {
        grid-column: span 1;
        color: rgba(245, 158, 11, 0.9);
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        white-space: nowrap;
        text-align: center;
        letter-spacing: -0.01em;
    }

    .avis-label-star5 {
        grid-column: span 1;
        color: #10b981;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        white-space: nowrap;
        text-align: center;
        letter-spacing: -0.01em;
    }

    .avis-confirm-btn {
        font-family: "Outfit", sans-serif;
        background-color: var(--accent-red);
        color: var(--white);
        padding: 13px 28px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 1.1em;
        border: none;
        cursor: pointer;
        margin-top: 25px;
        width: 100%;
        box-sizing: border-box;
        transition: background-color var(--transition-speed), transform 0.15s ease;
        animation: avisFadeIn 0.3s ease both;
    }

    .avis-confirm-btn:hover {
        background-color: var(--accent-green);
    }

    .avis-back-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-family: "Outfit", sans-serif;
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        margin-top: 4px;
        align-self: center;
        transition: color var(--transition-speed);
    }

    .avis-back-btn:hover {
        color: var(--text-main);
    }

    .avis-back-btn svg {
        width: 16px;
        height: 16px;
        color: #c59d5f;
    }

    .avis-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        text-align: left;
    }

    .avis-input,
    .avis-textarea {
        font-family: "Outfit", sans-serif;
        font-size: 1em;
        color: var(--text-main);
        background-color: var(--primary-bg);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        padding: 12px 14px;
        width: 100%;
        box-sizing: border-box;
        outline: none;
        transition: border-color var(--transition-speed);
    }

    .avis-input:focus,
    .avis-textarea:focus {
        border-color: var(--accent-green);
    }

    .avis-textarea {
        resize: vertical;
        min-height: 110px;
    }

    .avis-error {
        display: none;
        color: var(--accent-red);
        font-size: 0.95em;
        margin: 0;
        text-align: left;
    }

    .avis-error.visible {
        display: block;
    }

    .avis-submit-btn {
        font-family: "Outfit", sans-serif;
        background-color: var(--accent-red);
        color: var(--white);
        padding: 13px 24px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 1.1em;
        border: none;
        cursor: pointer;
        transition: background-color var(--transition-speed);
    }

    .avis-submit-btn:hover {
        background-color: var(--accent-green);
    }

    .avis-submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .avis-spinner {
        width: 42px;
        height: 42px;
        margin: 40px auto;
        border: 4px solid rgba(0, 0, 0, 0.08);
        border-top-color: var(--accent-red);
        border-radius: 50%;
        animation: avisSpin 0.8s linear infinite;
    }

    @keyframes avisSpin {
        to { transform: rotate(360deg); }
    }

    .avis-check-circle {
        width: 80px;
        height: 80px;
        margin: 0 auto 25px auto;
        border-radius: 50%;
        border: 2px solid var(--accent-green);
        background-color: rgba(25, 67, 70, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: avisPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes avisPop {
        from { transform: scale(0); }
        to { transform: scale(1); }
    }

    .avis-check-circle svg {
        width: 40px;
        height: 40px;
        color: var(--accent-green);
    }
</style>

<div class="avis-page animate__animated animate__fadeIn">
    <div class="avis-card">
        <a href="/en/">
            <img class="avis-logo" alt="Grill Lounge Logo" src="/logo-black.png" />
        </a>

        <!-- Loading: waiting on the public config (Google review URL) -->
        <div class="avis-step active" id="avis-step-loading">
            <div class="avis-spinner"></div>
        </div>

        <!-- Step 1: rate -->
        <div class="avis-step" id="avis-step-rate">
            <h1 class="avis-title">How was your experience?</h1>
            <p class="avis-subtitle">Your feedback means the world to us.</p>
            <div class="avis-stars" id="avis-rate-stars"></div>
            <div class="avis-labels-row">
                <div class="avis-label-bracket">
                    <div class="avis-bracket-col-1">
                        <span class="avis-tick"></span>
                        <span class="avis-line-left"></span>
                    </div>
                    <div class="avis-bracket-text">Not satisfied</div>
                    <div class="avis-bracket-col-3">
                        <span class="avis-line-right"></span>
                        <span class="avis-tick"></span>
                    </div>
                </div>
                <div class="avis-label-star4">Room to improve</div>
                <div class="avis-label-star5">Satisfied!</div>
            </div>
            <button type="button" class="avis-confirm-btn" id="avis-confirm-btn" style="display: none;">
                Continue
            </button>
        </div>

        <!-- Positive rating: redirecting to Google -->
        <div class="avis-step" id="avis-step-redirecting">
            <div class="avis-stars" id="avis-redirect-stars" style="margin-bottom: 25px;"></div>
            <p class="avis-subtitle" style="margin: 0;">Thank you! Redirecting...</p>
        </div>

        <!-- Negative rating: private feedback form -->
        <div class="avis-step" id="avis-step-feedback">
            <h1 class="avis-title">Help us improve</h1>
            <p class="avis-subtitle" id="avis-feedback-subtitle">Tell us what fell short. Your feedback stays private.</p>
            <form class="avis-form" id="avis-feedback-form" novalidate>
                <textarea class="avis-textarea" id="avis-text" placeholder="Your message..." aria-label="Help us improve"></textarea>
                <input class="avis-input" id="avis-email" type="email" placeholder="Email (optional)" aria-label="Email (optional)" />
                <p class="avis-error" id="avis-error"></p>
                <button class="avis-submit-btn" id="avis-submit" type="submit">Send</button>
                <button type="button" class="avis-back-btn" id="avis-back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>Back</span>
                </button>
            </form>
        </div>

        <!-- Thanks -->
        <div class="avis-step" id="avis-step-thanks">
            <div class="avis-check-circle">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h1 class="avis-title">Thank you for your feedback</h1>
            <p class="avis-subtitle" style="margin: 0;">We take your message to heart and are working to do better.</p>
        </div>
    </div>
</div>

<script>
    (function () {
        var API_BASE = "https://dishtributer.com/api";
        var API_HEADERS = {
            "Content-Type": "application/json",
            "x-api-key": "dt_QVQvdN7Gf9nHrUSitreJgqkz4s4BF34i"
        };
        var FALLBACK_GOOGLE_URL = "https://g.page/r/CfOqWTWPG1QYEBM/review";
        // Ratings at or above this threshold are routed to the public Google
        // page; anything below is captured privately.
        var POSITIVE_THRESHOLD = 5;

        var LABELS = {
            errorRequired: "Please write a message before sending.",
            errorGeneric: "Something went wrong. Please try again.",
            sending: "Sending...",
            submit: "Send",
            subtitle4: "Tell us how we can earn 5 stars next time. Your feedback stays private.",
            subtitle13: "Tell us what fell short of your expectations. Your feedback stays private."
        };

        var STAR_PATH = "M12 2.5l2.9 6.18 6.6.79-4.9 4.6 1.3 6.73L12 17.77l-5.9 3.03 1.3-6.73-4.9-4.6 6.6-.79z";

        var googleUrl = FALLBACK_GOOGLE_URL;
        var rating = 0;

        function showStep(name) {
            document.querySelectorAll(".avis-step").forEach(function (el) {
                el.classList.remove("active");
            });
            document.getElementById("avis-step-" + name).classList.add("active");
        }

        function starSvg() {
            return '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="' + STAR_PATH + '"/></svg>';
        }

        function paintStars(container, count) {
            container.querySelectorAll(".avis-star-btn").forEach(function (btn, i) {
                var isFilled = i < count;
                btn.classList.toggle("filled", isFilled);
                if (i === 4 && count === 5) {
                    btn.classList.add("star-5-accent");
                } else {
                    btn.classList.remove("star-5-accent");
                }
            });
        }

        // Build the interactive rating stars
        var rateStars = document.getElementById("avis-rate-stars");
        var confirmBtn = document.getElementById("avis-confirm-btn");

        for (var i = 1; i <= 5; i++) {
            (function (value) {
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "avis-star-btn";
                btn.setAttribute("aria-label", value + " / 5");
                btn.innerHTML = starSvg();
                btn.addEventListener("mouseenter", function () {
                    paintStars(rateStars, value);
                });
                btn.addEventListener("click", function () {
                    selectRating(value);
                });
                rateStars.appendChild(btn);
            })(i);
        }
        rateStars.addEventListener("mouseleave", function () {
            paintStars(rateStars, rating);
        });

        function selectRating(value) {
            rating = value;
            paintStars(rateStars, rating);

            if (value >= POSITIVE_THRESHOLD) {
                if (confirmBtn) confirmBtn.style.display = "none";
                var redirectStars = document.getElementById("avis-redirect-stars");
                redirectStars.innerHTML = "";
                for (var j = 1; j <= 5; j++) {
                    var star = document.createElement("span");
                    star.className = "avis-star-btn" + (j <= value ? " filled" : "") + (j === 5 && value === 5 ? " star-5-accent" : "");
                    star.innerHTML = starSvg();
                    redirectStars.appendChild(star);
                }
                showStep("redirecting");
                setTimeout(function () {
                    window.location.assign(googleUrl || FALLBACK_GOOGLE_URL);
                }, 900);
            } else {
                if (confirmBtn) confirmBtn.style.display = "block";
            }
        }

        if (confirmBtn) {
            confirmBtn.addEventListener("click", function () {
                if (rating > 0 && rating < POSITIVE_THRESHOLD) {
                    var subtitleEl = document.getElementById("avis-feedback-subtitle");
                    if (subtitleEl) {
                        subtitleEl.textContent = rating === 4 ? LABELS.subtitle4 : LABELS.subtitle13;
                    }
                    showStep("feedback");
                    document.getElementById("avis-text").focus();
                }
            });
        }

        var backBtn = document.getElementById("avis-back-btn");
        if (backBtn) {
            backBtn.addEventListener("click", function () {
                showStep("rate");
            });
        }

        // Pre-fetch the Google review link so a positive rating redirects instantly.
        fetch(API_BASE + "/public/config", { headers: API_HEADERS })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
                var url = data && data.reviewsConfig && data.reviewsConfig.googleReviewUrl;
                if (url) googleUrl = url;
            })
            .catch(function (err) {
                console.error("Failed to load config, using default redirect:", err);
            })
            .finally(function () {
                showStep("rate");
            });

        // Private feedback submission
        var form = document.getElementById("avis-feedback-form");
        var textEl = document.getElementById("avis-text");
        var emailEl = document.getElementById("avis-email");
        var errorEl = document.getElementById("avis-error");
        var submitBtn = document.getElementById("avis-submit");

        function setError(message) {
            errorEl.textContent = message || "";
            errorEl.classList.toggle("visible", !!message);
        }

        textEl.addEventListener("input", function () {
            setError(null);
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            var text = textEl.value.trim();
            if (!text) {
                setError(LABELS.errorRequired);
                return;
            }
            setError(null);
            submitBtn.disabled = true;
            submitBtn.textContent = LABELS.sending;

            var payload = { starCount: rating, text: text };
            var email = emailEl.value.trim();
            if (email) payload.customerEmail = email;

            fetch(API_BASE + "/public/reviews", {
                method: "POST",
                headers: API_HEADERS,
                body: JSON.stringify(payload)
            })
                .then(function (res) {
                    if (!res.ok) {
                        return res.json().catch(function () { return {}; }).then(function (body) {
                            throw new Error(body.error || LABELS.errorGeneric);
                        });
                    }
                    showStep("thanks");
                })
                .catch(function (err) {
                    setError(err && err.message ? err.message : LABELS.errorGeneric);
                })
                .finally(function () {
                    submitBtn.disabled = false;
                    submitBtn.textContent = LABELS.submit;
                });
        });
    })();
</script>

    </div>

    <!-- Cookie Consent Banner Include -->
    

    <!-- Vanilla Javascript Logic -->
    <script src="/assets/js/main.js"></script>
  </body>
</html>
